<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230284c7'/><path d='M30,30 L50,75 L70,30' stroke='white' stroke-width='10' stroke-linecap='round' stroke-linejoin='round' fill='none'/><circle cx='50' cy='30' r='6' fill='%2300f0ff'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VARUNA — Adaptive Multi-Model Forecast Intelligence Centre | MoES NCMRWF SIH26081</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script>
      // Apply the saved / OS theme before first paint (prevents a dark->light flash on reload)
      (function () {
        try {
          var t = localStorage.getItem('varuna_theme');
          if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          var onDashboard = location.pathname.indexOf('/dashboard') === 0;
          // Landing & login pages are designed dark-only; the theme toggle applies to the dashboard
          if (t === 'light' && onDashboard) document.documentElement.classList.remove('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-surface text-on-surface font-body-md text-body-md antialiased selection:bg-sky-500/30 min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
